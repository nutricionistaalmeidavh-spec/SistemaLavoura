name: P0 hardening

on:
  pull_request:
    branches:
      - migration/standalone-phase-0-8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test tests/p0-hardening.test.js
