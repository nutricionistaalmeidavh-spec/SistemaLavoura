name: P1 architecture and operation

on:
  push:
    branches:
      - feature/p1-architecture-operation
      - feature/p2-product-agricola
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-p1:
    name: Linux P1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run p1
      - name: Upload Linux P1 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-linux-qa
          path: qa-artifacts/
          if-no-files-found: ignore

  windows-p1:
    name: Windows P1 release certification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Create non-destructive synthetic legacy database
        shell: pwsh
        run: |
          @'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('legacy-ci.sqlite');
          db.exec('CREATE TABLE customer_data(id TEXT PRIMARY KEY,value TEXT);');
          db.prepare('INSERT INTO customer_data VALUES(?,?)').run('legacy-ci','preserve-me');
          db.close();
          '@ | Set-Content -Encoding utf8 .\create-legacy-ci.mjs
          node .\create-legacy-ci.mjs
          "ARTISYS_LEGACY_DB=$((Resolve-Path '.\legacy-ci.sqlite').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run release:certify
      - run: npm run qa:p1
      - name: Upload Windows P1 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-windows-qa
          path: qa-artifacts/
          if-no-files-found: ignore
      - name: Upload P1 certified installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-windows-installer
          path: release/*.exe
          if-no-files-found: ignore
