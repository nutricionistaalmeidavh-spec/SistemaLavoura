name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .release/v1.0.0.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  certify-and-publish:
    name: Certify, clean-install and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate release identity and license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw .\package.json | ConvertFrom-Json
          $manifest = Get-Content -Raw .\.release\v1.0.0.json | ConvertFrom-Json
          if ($package.version -ne '1.0.0') { throw "package.json version must be 1.0.0" }
          if ($package.license -ne 'AGPL-3.0-only') { throw "package.json license must be AGPL-3.0-only" }
          if ($manifest.version -ne $package.version) { throw "release manifest version does not match package.json" }
          if ($manifest.tag -ne 'v1.0.0') { throw "release manifest tag must be v1.0.0" }
          if ($manifest.license -ne 'AGPL-3.0-only') { throw "release manifest license must be AGPL-3.0-only" }
          $licenseBlob = (git hash-object LICENSE).Trim()
          if ($licenseBlob -ne '0c97efd25b5974b974ed9a8a18207bc4f55bb338') {
            throw "LICENSE is not the canonical SPDX AGPL-3.0-only text. Blob: $licenseBlob"
          }

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Create non-destructive synthetic legacy database
        shell: pwsh
        run: |
          @'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('legacy-release-ci.sqlite');
          db.exec('CREATE TABLE customer_data(id TEXT PRIMARY KEY,value TEXT);');
          db.prepare('INSERT INTO customer_data VALUES(?,?)').run('release-ci','preserve-me');
          db.close();
          '@ | Set-Content -Encoding utf8 .\create-legacy-release-ci.mjs
          node .\create-legacy-release-ci.mjs
          "ARTISYS_LEGACY_DB=$((Resolve-Path '.\legacy-release-ci.sqlite').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run fail-closed release certification
        shell: pwsh
        run: npm run release:certify

      - name: Smoke-test installer on clean Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem .\release\ArtiSys-Lavoura-Setup-1.0.0.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw 'Certified installer was not generated.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'artisys-lavoura-clean-install'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with code $($install.ExitCode)" }

          $appExe = Join-Path $installDir 'ArtiSys Lavoura.exe'
          if (-not (Test-Path $appExe)) { throw "Installed executable not found: $appExe" }

          $env:ELECTRON_RUN_AS_NODE = '1'
          & $appExe -e "if(!process.versions.electron){process.exit(2)}; console.log('Electron',process.versions.electron)"
          $runtimeExit = $LASTEXITCODE
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if ($runtimeExit -ne 0) { throw "Installed Electron runtime smoke test failed with code $runtimeExit" }

          $process = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed application exited during startup smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item .\release\ArtiSys-Lavoura-Setup-1.0.0.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Encoding ascii -NoNewline .\release\SHA256SUMS.txt
          Write-Host "SHA-256: $hash"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-certification-evidence
          path: qa-artifacts/
          if-no-files-found: warn

      - name: Upload certified installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-windows-installer
          path: |
            release/ArtiSys-Lavoura-Setup-1.0.0.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.0'
          $releaseExists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }

          if ($releaseExists) {
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag points to $tagCommit instead of $env:GITHUB_SHA"
            }
            gh release upload $tag .\release\ArtiSys-Lavoura-Setup-1.0.0.exe .\release\SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag .\release\ArtiSys-Lavoura-Setup-1.0.0.exe .\release\SHA256SUMS.txt --target $env:GITHUB_SHA --title 'ArtiSys Lavoura v1.0.0' --notes-file .\docs\RELEASE_1.0.0.md --repo $env:GITHUB_REPOSITORY
          }
