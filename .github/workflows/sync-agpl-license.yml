name: Sync canonical AGPL license

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - .github/workflows/sync-agpl-license.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Download canonical AGPL-3.0-only text
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt -o LICENSE
          test "$(git hash-object LICENSE)" = "0c97efd25b5974b974ed9a8a18207bc4f55bb338"
      - name: Commit canonical license and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-agpl-license.yml
          git add LICENSE
          git commit -m "fix(license): sync canonical AGPL-3.0-only text"
          git push origin HEAD:release/v1.0.0
