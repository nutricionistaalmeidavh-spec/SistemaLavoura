labels:
  platform: windows/amd64
  backend: local

when:
  - event: [manual]

steps:
  - name: verify
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - 'npm install --no-audit --no-fund'
      - 'npx playwright install chromium'
      - 'npm run phase5'
      - 'npm run compat:contract'
